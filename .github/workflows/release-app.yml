name: Release App

# DM Command Center releases (Windows): a new version in packages/app/package.json,
# or new notes in packages/app/RELEASE_NOTES.md, on main builds the installer and
# publishes it as a GitHub release. The app's update check reads latest.yml from
# the newest release, so installed copies offer the update by themselves.
# A version is released only once its "## X.Y.Z" notes are in RELEASE_NOTES.md,
# and never twice (an existing tag vX.Y.Z is skipped).

on:
  push:
    branches:
      - main
    paths:
      - 'packages/app/package.json'
      - 'packages/app/RELEASE_NOTES.md'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/app/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "App version: $VERSION"

      - name: Check if release exists
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/v${VERSION}$"; then
            echo "Tag v${VERSION} already exists - skipping release"
            echo "should_release=false" >> $GITHUB_OUTPUT
          elif ! grep -qxF "## ${VERSION}" packages/app/RELEASE_NOTES.md; then
            echo "No '## ${VERSION}' notes in RELEASE_NOTES.md yet - skipping release"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Tag v${VERSION} does not exist - will create release"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  build-windows:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Build MCP server (bundled for "Connect your AI")
        run: pnpm --filter @dm-hero/mcp build

      - name: Build Nuxt
        run: pnpm --filter @dm-hero/app build

      - name: Rebuild better-sqlite3 for Electron
        run: pnpm --filter @dm-hero/app electron:rebuild

      - name: Build Electron app
        working-directory: packages/app
        run: pnpm exec electron-builder --win --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dm-command-center-windows
          path: |
            packages/app/dist-electron/*.exe
            packages/app/dist-electron/*.exe.blockmap
            packages/app/dist-electron/latest.yml
          if-no-files-found: error

  create-release:
    needs: [check, build-windows]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: dm-command-center-windows
          path: ./artifacts

      - name: Read release notes
        id: notes
        run: |
          # This version's section of RELEASE_NOTES.md (from "## X.Y.Z" to the next heading)
          VERSION="${{ needs.check.outputs.version }}"
          NOTES=$(awk -v h="## ${VERSION}" '$0==h{on=1; next} /^## /{on=0} on' packages/app/RELEASE_NOTES.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: DM Command Center ${{ needs.check.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          files: ./artifacts/*
          draft: false
          prerelease: ${{ contains(needs.check.outputs.version, 'alpha') || contains(needs.check.outputs.version, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
